[workspace]
changelog_update = true
semver_check = true
dependencies_update = true
git_release_enable = true

# All published crates share a version because public Facet and format types cross
# package boundaries. A release must not leave consumers with incompatible rc lines.
[[package]]
name = "facet-dessert"
version_group = "facet-format"
changelog_path = "CHANGELOG.md"

